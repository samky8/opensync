name: OpenSync
options:
  bundleIdPrefix: com.opensync
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OpenSync:
    type: application
    platform: iOS
    sources:
      - OpenSync
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opensync.app
        INFOPLIST_FILE: OpenSync/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  OpenSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OpenSyncTests]
    dependencies:
      - target: OpenSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OpenSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OpenSyncUITests]
    dependencies:
      - target: OpenSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenSync:
    build:
      targets:
        OpenSync: all
    test:
      targets: [OpenSyncTests, OpenSyncUITests]
    archive:
      config: Release
